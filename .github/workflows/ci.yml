name: CI

on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (workspace)
        run: cargo test --workspace --locked --all-targets

      - name: two-process integration test
        # Spins up two independent clipd daemons on different ports, sends
        # a payload peer-a → peer-b, asserts peer-b's clipboard received it.
        # Closer to two real laptops on a LAN than the in-process unit tests.
        # Linux runners without a display server SKIP — treated as PASS
        # because the bug surface is platform-clipboard-availability, not
        # clipd. macOS (next job) is the gating one.
        run: |
          cargo build --workspace --locked
          ./tests/two-bin-smoke.sh ./target/debug/clipd || rc=$?
          if [ "${rc:-0}" = "77" ]; then
            echo "::notice::two-process test SKIPPED (no display server); see run log"
            exit 0
          fi
          exit "${rc:-0}"

  build:
    name: build (macos, ${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: cargo build --release (workspace)
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: two-process integration test (${{ matrix.target }})
        # Same test as the ubuntu job, but on the actual target arch/OS we ship.
        # This is the closest CI gets to a real multi-device LAN test.
        # macOS runners always have NSPasteboard, so this must PASS (no skip).
        run: |
          cargo build --workspace --release --locked --target ${{ matrix.target }}
          ./tests/two-bin-smoke.sh ./target/${{ matrix.target }}/release/clipd
